
name: Extract NJR RABBY ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'NJR-RABBY-iPhone-Offline-Ready.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Website ZIP
        run: |
          mkdir -p extracted
          unzip -o NJR-RABBY-iPhone-Offline-Ready.zip -d extracted

      - name: Save Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/
          git commit -m "Extract NJR RABBY website" || echo "No changes"
          git push
